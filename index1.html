<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe3">
<title>കുട്ടികളുടെ ഭഗവദ്ഗീത — Audio Book</title>
<style>
:root{
  --bg:#f7f1e5;--paper:#fffdf7;--ink:#33291f;--muted:#766957;
  --gold:#c98b35;--green:#47745c;--soft:#efe2c8;--line:#e5d6bd;
  --shadow:0 12px 35px rgba(64,45,25,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#efe4cf,#faf7ef 32%,#f4ecdd);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Malayalam",sans-serif}
button{font:inherit}
.app{max-width:820px;margin:auto;padding:18px 14px 90px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 22px;background:linear-gradient(135deg,#fffaf0,#ead8b5);box-shadow:var(--shadow);border:1px solid #ead9bc}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:float 6s ease-in-out infinite}
.hero:before{width:130px;height:130px;background:#e6bf69;right:-35px;top:-45px}
.hero:after{width:90px;height:90px;background:#8fb89a;left:-35px;bottom:-40px;animation-delay:1.5s}
.hero h1{margin:0;font-size:clamp(27px,7vw,44px);line-height:1.1;position:relative;z-index:1}
.hero p{margin:10px 0 0;color:var(--muted);position:relative;z-index:1}
.hero-art{display:flex;align-items:center;gap:10px;margin-top:18px;position:relative;z-index:1}
.hero-art img{width:54px;height:54px;object-fit:contain;animation:bob 3.5s ease-in-out infinite}
.controls{position:sticky;top:8px;z-index:20;margin:14px 0;padding:10px;border-radius:20px;background:rgba(255,253,247,.9);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(50,40,25,.08)}
.control-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:10px 13px;background:#ead9ba;color:#382b1e;font-weight:700;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn:active{transform:scale(.97)}
select{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px;color:var(--ink)}
.progress{height:6px;background:#eadfca;border-radius:99px;margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.now{font-size:13px;color:var(--muted);margin-top:7px;min-height:18px}
.chapter{position:relative;margin:15px 0;padding:18px 16px 17px;background:rgba(255,253,247,.94);border:1px solid var(--line);border-radius:23px;box-shadow:0 8px 24px rgba(55,40,20,.07);overflow:hidden;scroll-margin-top:100px}
.chapter.playing{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,139,53,.14),var(--shadow)}
.chapter:after{content:"";position:absolute;right:-28px;top:-28px;width:100px;height:100px;border-radius:50%;background:var(--soft);opacity:.4;z-index:0}
.chapter-top{display:flex;gap:13px;align-items:center;position:relative;z-index:1}
.icon{width:58px;height:58px;border-radius:18px;background:#f2e6cf;display:grid;place-items:center;flex:none;animation:bob 4s ease-in-out infinite}
.icon img{width:42px;height:42px;object-fit:contain}
h2{font-size:20px;line-height:1.3;margin:0}
.num{font-size:12px;color:var(--muted);margin-bottom:3px}
.lines{position:relative;z-index:1;margin:13px 0 10px;padding-left:0;list-style:none}
.lines li{margin:7px 0;padding-left:18px;line-height:1.65;font-size:16px}
.lines li:before{content:"•";color:var(--gold);font-weight:900;position:absolute;margin-left:-15px}
.moral{position:relative;z-index:1;margin:0;padding:10px 12px;border-radius:14px;background:#eef4ed;color:#315640;font-weight:700;font-size:14px}
.chapter-actions{display:flex;gap:7px;margin-top:10px;position:relative;z-index:1}
.small{padding:8px 11px;font-size:13px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,7px)}}
@media(max-width:480px){.app{padding:10px 9px 80px}.hero{padding:22px 17px}.chapter{padding:15px 13px}.lines li{font-size:15px}.icon{width:52px;height:52px}}

.language-wrap{display:inline-flex;align-items:center;gap:7px;margin-top:14px;position:relative;z-index:2}
.language-wrap label{font-size:12px;color:var(--muted)}
.language-wrap select{min-width:110px;padding:7px 9px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.75);color:var(--ink)}
</style>

<style>
.brandbar{
  position:sticky;
  top:0;
  z-index:100;
  margin:-18px -14px 14px;
  padding:10px 14px;
  background:rgba(255,253,247,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #e5d6bd;
  box-shadow:0 4px 18px rgba(50,40,25,.08);
}
.brandbar-inner{
  max-width:820px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand-main{
  min-width:0;
  line-height:1.25;
}
.brand-title{
  font-weight:800;
  font-size:15px;
  color:#33291f;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{
  margin-top:2px;
  font-size:11px;
  color:#766957;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-contact{
  flex:none;
  text-align:right;
  font-size:10px;
  line-height:1.35;
  color:#47745c;
  font-weight:700;
}
@media(max-width:560px){
  .brandbar{margin:-10px -9px 12px;padding:8px 10px}
  .brandbar-inner{gap:8px}
  .brand-title{font-size:13px}
  .brand-sub{font-size:9px}
  .brand-contact{font-size:9px}
}
</style>
</head>
<body>
<main class="app">
<div class="brandbar">
  <div class="brandbar-inner">
    <div class="brand-main">
      <div class="brand-title">🌸 Kid's Bhagavad Gita : Dr. Akhil Remesh.M</div>
      <div class="brand-sub">Vaidyanatham Vaidyasala. Ayoor. Kerala</div>
    </div>
    <div class="brand-contact">
      8921669537<br>
      Wellness for All.
    </div>
  </div>
</div>

<section class="hero">
  <h1>🌸 കുട്ടികളുടെ ഭഗവദ്ഗീത</h1>
  <div class="language-wrap">
  <label for="language">Language</label>
  <select id="language" aria-label="Language">
    <option value="ml" selected>മലയാളം</option>
    <option value="en">English</option>
  </select>
</div>
  <div class="hero-art">
    <img src="https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/1F3F9.svg" alt="bow">
    <img src="https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/1F33F.svg" alt="flower">
    <img src="https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/1F30F.svg" alt="earth">
    <img src="https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/1F31E.svg" alt="sun">
  </div>
</section>

<section class="controls" aria-label="Audio controls">
  <div class="control-row">
    <button class="btn primary" id="playAll">▶ എല്ലാം</button>
    <button class="btn" id="pause">⏸</button>
    <button class="btn" id="stop">⏹</button>
    <button class="btn" id="prev">‹</button>
    <button class="btn" id="next">›</button>
    <select id="rate" aria-label="Speech speed">
      <option value="0.75">0.75×</option>
      <option value="0.9" selected>0.9×</option>
      <option value="1">1×</option>
      <option value="1.15">1.15×</option>
    </select>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="now" id="now">🔊 ഒരു അധ്യായം തിരഞ്ഞെടുക്കുക.</div>
</section>

<div id="chapters"></div>

<div class="footer">
  കുട്ടികൾക്കായുള്ള ലളിതമായ കഥാരൂപം • 18 അധ്യായങ്ങൾ • Audio narration uses your device/browser Malayalam voice when available.
</div>
</main>

const root=document.getElementById("chapters");
chapters.forEach((c,i)=>{
  const sec=document.createElement("article");
  sec.className="chapter"; sec.id="ch"+i;
  sec.innerHTML=`
    <div class="chapter-top">
      <div class="icon"><img src="${IMG+c[2]}" alt="" onerror="this.style.display='none';this.parentElement.textContent='🌸'"></div>
      <div><div class="num">അധ്യായം ${i+1}</div><h2>${c[0]} <span style="font-weight:500;color:#7a6a58">(${c[1]})</span></h2></div>
    </div>
    <ul class="lines">${c[3].map(x=>`<li>${x}</li>`).join("")}</ul>
    <p class="moral">🌱 ${c[4]}</p>
    <div class="chapter-actions">
      <button class="btn small primary" data-play="${i}">🔊 കേൾക്കാം</button>
      <button class="btn small" data-stop="${i}">⏹ നിർത്തുക</button>
    </div>`;
  root.appendChild(sec);
});


const enChapters=[
["Arjuna's Sorrow","Arjuna saw his relatives and friends on the battlefield. His heart became heavy and he did not know what to do. He asked Krishna for help.","We can share our feelings with love."],
["Understanding Life","Krishna explained that the body changes and grows. He taught Arjuna about the eternal self. He also taught him to stay calm.","We can understand life with a calm mind."],
["Doing Our Duty","Everyone has work to do. We should do our work well without thinking only about the result. Krishna asked Arjuna to do his duty.","We can do our work happily and carefully."],
["Good Knowledge","Good knowledge helps us understand life. Wise action helps us grow. Krishna also explained why goodness comes into the world.","We can learn good things and use them well."],
["Work and Peace","We can work while keeping peace in our heart. Work done without selfishness brings inner joy. Krishna taught Arjuna to see people equally.","Good work can bring peace to the heart."],
["A Peaceful Mind","The mind becomes calm through attention and practice. When the mind wanders, we gently bring it back. A peaceful mind can remember God.","We can practise calm attention."],
["Knowing Krishna","Krishna explained how the world and nature are connected with him. Water, earth, sun and moon are examples of his power. He taught Arjuna to know and love him.","We can love and learn about nature and the world."],

["A Loving Devotee","Arjuna asked what a loving devotee is like. Krishna described a person filled with love and compassion. Such a person treats everyone kindly.","We can grow a loving and kind heart."],

["Three Qualities","Krishna explained three kinds of qualities in people. One brings calmness and understanding, another encourages activity, and another brings rest. Arjuna learned to recognize them.","We can grow calmness, understanding and good action."],
["The Tree of Life","Krishna compared the world to a great tree with roots and branches. He explained how the world exists and where it comes from. He taught about the highest truth.","We can understand life's great connection with love."],
["Good Qualities","Krishna spoke about courage, truth, compassion and peace. He also explained how pride, anger and harmful ways lead to sorrow. Arjuna learned to develop good qualities.","We can grow love, truth, compassion and courage."],
["Faith","Krishna explained that people's faith is connected with their nature. Food, giving, prayer and good actions can also be done in different ways. He taught Arjuna to develop good faith and good actions.","We can grow good faith and good habits."],
["Arjuna's Decision","Krishna gave Arjuna the main teachings again. He taught him to do his duty and trust God. Arjuna's confusion cleared and he was ready to act.","With knowledge, love and courage, we can move forward."]

let current=-1, speaking=false;
const synth=window.speechSynthesis;
const now=document.getElementById("now"), bar=document.getElementById("bar");

function textFor(i){
 const lang=document.getElementById("language").value;
 if(lang==="en"){
   const c=enChapters[i];
   return `Chapter ${i+1}. ${c[0]}. ${c[1]} Moral. ${c[2]}`;
 }
 const c=chapters[i];
 return `അധ്യായം ${i+1}. ${c[0]}. ${c[1]}. ${c[3].join(" ")} ഗുണപാഠം. ${c[4]}`;
}
function chooseVoice(){
 const voices=synth.getVoices();
 return voices.find(v=>/ml-IN/i.test(v.lang)) || voices.find(v=>/^ml/i.test(v.lang)) || voices.find(v=>/Malayalam/i.test(v.name)) || null;
}
function speak(i){
 if(i<0||i>=chapters.length)return;
 synth.cancel(); current=i; speaking=true;
 document.querySelectorAll(".chapter").forEach(x=>x.classList.remove("playing"));
 const el=document.getElementById("ch"+i); el.classList.add("playing"); el.scrollIntoView({behavior:"smooth",block:"center"});
 const u=new SpeechSynthesisUtterance(textFor(i));
 const lang=document.getElementById("language").value;
 u.lang=lang==="en"?"en-IN":"ml-IN"; u.rate=parseFloat(document.getElementById("rate").value); u.pitch=1.02;
 const v=chooseVoice(); if(v)u.voice=v;
 u.onstart=()=>{now.textContent=`🔊 ഇപ്പോൾ കേൾക്കുന്നു: അധ്യായം ${i+1} — ${chapters[i][0]}`;bar.style.width=((i+1)/chapters.length*100)+"%"};
 u.onend=()=>{speaking=false;el.classList.remove("playing"); if(current<chapters.length-1) setTimeout(()=>speak(current+1),250); else now.textContent="🎉 18 അധ്യായങ്ങളും പൂർത്തിയായി."};
 u.onerror=()=>{
  speaking=false;
  now.textContent=document.getElementById("language").value==="en"
    ?"Speech is unavailable. Check your device text-to-speech settings."
    :"ഈ ഉപകരണത്തിൽ മലയാളം ശബ്ദം ലഭ്യമല്ലെങ്കിൽ ഫോൺ Text-to-Speech settings പരിശോധിക്കുക.";
};
 synth.speak(u);
}
document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>speak(+b.dataset.play));
document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{synth.cancel();speaking=false;document.getElementById("ch"+b.dataset.stop).classList.remove("playing");now.textContent="ഓഡിയോ നിർത്തി."});
document.getElementById("playAll").onclick=()=>speak(current>=0?current:0);
document.getElementById("pause").onclick=()=>{if(synth.speaking){synth.paused?synth.resume():synth.pause()}};
document.getElementById("stop").onclick=()=>{synth.cancel();speaking=false;document.querySelectorAll(".chapter").forEach(x=>x.classList.remove("playing"));now.textContent="ഓഡിയോ നിർത്തി.";};
document.getElementById("next").onclick=()=>speak(Math.min(chapters.length-1,current+1));
document.getElementById("prev").onclick=()=>speak(Math.max(0,current-1));
synth.onvoiceschanged=()=>{};
document.getElementById("language").addEventListener("change",()=>{
  synth.cancel(); speaking=false;
  now.textContent=document.getElementById("language").value==="en"?"🔊 Choose a chapter to listen.":"🔊 ഒരു അധ്യായം തിരഞ്ഞെടുക്കുക.";
});
</script>

<script>
(function(){
  const langEl=document.getElementById("language");
  if(!langEl) return;
  const originalRender=document.querySelectorAll(".chapter");

  function renderLanguage(){
    const lang=langEl.value;
    document.querySelectorAll(".chapter").forEach((sec,i)=>{
      if(lang==="en"){
        const c=enChapters[i];
        const title=sec.querySelector("h2");
        const num=sec.querySelector(".num");
        const lis=sec.querySelectorAll(".lines li");
        const moral=sec.querySelector(".moral");
        if(title) title.innerHTML=`${c[0]} <span style="font-weight:500;color:#7a6a58">(${chapters[i][1]})</span>`;
        if(num) num.textContent=`Chapter ${i+1}`;
        c[1].split(". ").slice(0,3).forEach((x,j)=>{if(lis[j]) lis[j].textContent=x+(x.endsWith(".")?"":".")});
        if(moral) moral.textContent="🌱 "+c[2];
      }else{
        const c=chapters[i];
        const title=sec.querySelector("h2");
        const num=sec.querySelector(".num");
        const lis=sec.querySelectorAll(".lines li");
        const moral=sec.querySelector(".moral");
        if(title) title.innerHTML=`${c[0]} <span style="font-weight:500;color:#7a6a58">(${c[1]})</span>`;
        if(num) num.textContent=`അധ്യായം ${i+1}`;
        c[3].forEach((x,j)=>{if(lis[j]) lis[j].textContent=x});
        if(moral) moral.textContent="🌱 "+c[4];
      }
    });
    document.documentElement.lang=lang==="en"?"en":"ml";
    document.querySelectorAll("[data-play]").forEach(b=>{
      b.textContent=lang==="en"?"🔊 Listen":"🔊 കേൾക്കാം";
    });
    document.querySelectorAll("[data-stop]").forEach(b=>{
      b.textContent=lang==="en"?"⏹ Stop":"⏹ നിർത്തുക";
    });
    document.getElementById("playAll").textContent=lang==="en"?"▶ Play all":"▶ എല്ലാം കേൾക്കാം";
    document.getElementById("now").textContent=lang==="en"?"🔊 Choose a chapter to listen.":"🔊 ഒരു അധ്യായം തിരഞ്ഞെടുക്കുക.";
  }

  langEl.addEventListener("change",function(){
    if(window.speechSynthesis) speechSynthesis.cancel();
    window.speaking=false;
    renderLanguage();
  });
  renderLanguage();
})();
</script>
